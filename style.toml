# How the cards look. Edit freely and rebuild with `python build.py`.
# Sizes are pixels on one card. Colours are hex strings.

[card]
width = 480
height = 672
frame = 14               # coloured border around the card
corner_radius = 20
background = "#FBF8F1"   # card body
text_color = "#1E1E1E"
muted_color = "#6E6A63"  # type line, id and version
header_height = 72       # coloured name band at the top
padding = 22             # space between the frame and the text

[fonts]
regular = "fonts/Inter-Regular.otf"
bold = "fonts/Inter-Bold.otf"
semibold = "fonts/Inter-SemiBold.otf"
italic = "fonts/Inter-Italic.otf"

[sizes]
name = 31          # shrinks automatically if a name is too long
cost = 32
type_line = 16
build_line = 24
body = 30          # card text; shrinks down to body_min if it doesn't fit
body_min = 16
footer = 14

[text]
# These phrases are printed in bold wherever they appear in card text.
keywords = ["Start:", "Activate:", "Build:", "Choose one:"]
line_spacing = 1.3

[track]
# Card types that sit on the shared track get a band across the bottom,
# edge to edge, so cards placed side by side read as one continuous track.
types = ["Event"]
height = 12
from_bottom = 92   # distance from the bottom edge of the card to the band
color = "#3A3A3A"

# One colour per card type. Every type used in cards.csv needs an entry here.
[types.Action]
color = "#2F5D8A"

[types.Event]
color = "#7A4E2D"

[types.Basic]
color = "#5E6366"

[types.Monument]
color = "#9C7A1E"

# Card backs, one per deck group in cards.csv.
[backs.Starting]
color = "#2B3A42"
label = "Starting deck"

[backs.Draft]
color = "#4B2E5C"
label = "Draft pool"

[backs.Shared]
color = "#6E5512"
label = "Shared"

[sheet]
# Tabletop Simulator reads cards from grid images. 8 x 6 at 480 x 672
# keeps each sheet under TTS's recommended 4096 px limit.
max_columns = 8
max_rows = 6
